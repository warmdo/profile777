<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BUKTI WD BARIS DEPAN</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#0f172a;
  color:white;
  padding:20px;
}

h2{
  margin-bottom:20px;
  font-size:28px;
}

.topbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

select,input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#1e293b;
  color:white;
  outline:none;
}

.btn{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  background:linear-gradient(45deg,#3b82f6,#9333ea);
  color:white;
  cursor:pointer;
  font-weight:600;
}

.table-wrap{
  overflow-x:auto;
  border-radius:16px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#111827;
}

th{
  background:#2563eb;
  padding:14px;
}

td{
  padding:12px;
  text-align:center;
  border-bottom:1px solid #1f2937;
}

td img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:10px;
  cursor:pointer;
  transition:.2s;
}

td img:hover{
  transform:scale(1.05);
}

.action-btn{
  padding:6px 10px;
  border:none;
  border-radius:8px;
  margin:2px;
  cursor:pointer;
  color:white;
  font-size:12px;
}

.edit{
  background:#f59e0b;
}

.del{
  background:#ef4444;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  justify-content:center;
  align-items:center;
  padding:20px;
  z-index:999;
}

.box{
  background:#111827;
  padding:20px;
  border-radius:16px;
  width:100%;
  max-width:420px;
}

.box h3{
  margin-bottom:15px;
}

#pasteArea{
  border:2px dashed #475569;
  padding:20px;
  border-radius:10px;
  text-align:center;
  cursor:pointer;
  margin-top:10px;
  transition:.3s;
}

#pasteArea:hover{
  border-color:#3b82f6;
}

#previewImage{
  width:100%;
  margin-top:10px;
  display:none;
  border-radius:10px;
  max-height:300px;
  object-fit:cover;
}

#toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#111827;
  padding:12px 20px;
  border-radius:10px;
  opacity:0;
  transition:.3s;
  z-index:9999;
}

#toast.show{
  opacity:1;
}

/* IMAGE MODAL */

.image-modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  justify-content:center;
  align-items:center;
  z-index:99999;
  cursor:pointer;
  padding:20px;
}

.image-modal img{
  max-width:90%;
  max-height:90%;
  border-radius:16px;
  object-fit:contain;
  animation:zoom .2s ease;
}

@keyframes zoom{

  from{
    transform:scale(.8);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }
}

@media(max-width:768px){

  body{
    padding:15px;
  }

  h2{
    font-size:22px;
  }

  th,td{
    font-size:13px;
    padding:10px;
  }

  td img{
    width:60px;
    height:60px;
  }
}

</style>
</head>

<body>

<h2>BUKTI WD BARIS DEPAN</h2>

<div class="topbar">

  <select id="siteFilter"></select>

  <button class="btn" onclick="openForm()">
    + Tambah
  </button>

</div>

<div class="table-wrap">

<table>

<thead>
<tr>
  <th>Situs</th>
  <th>Jam WD</th>
  <th>Gambar</th>
  <th>Aksi</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

</div>

<!-- FORM MODAL -->

<div class="modal" id="modal" onclick="closeModal(event)">

<div class="box">

<h3>Form WD</h3>

<select id="site">
  <option>Edan777</option>
  <option>Republik62</option>
  <option>Istana62</option>
  <option>Warga62</option>
</select>

<input type="datetime-local" id="jam">

<input
  type="text"
  id="gambar"
  placeholder="URL / Base64 Gambar"
  oninput="updatePreview()"
>

<img id="previewImage">

<div id="pasteArea">
  Paste / Drag Gambar di sini
</div>

<br>

<button class="btn" onclick="save()">
  Simpan
</button>

</div>
</div>

<!-- IMAGE VIEWER -->

<div id="imageModal" class="image-modal">

  <img id="modalImage">

</div>

<div id="toast"></div>

<script>

/* =========================
   API
========================= */

const API = "https://script.google.com/macros/s/AKfycbwSxVEAM6Hu8O4Foot-iz3e7_IFWnOE7SdAAyYCb68EHOgaQ5KVOtEOuCi5-2znu-VFtQ/exec";

/* =========================
   DATA
========================= */

let data = [];
let editId = null;

/* =========================
   ELEMENT
========================= */

const table = document.getElementById("table");
const site = document.getElementById("site");
const siteFilter = document.getElementById("siteFilter");
const jam = document.getElementById("jam");
const gambar = document.getElementById("gambar");
const previewImage = document.getElementById("previewImage");
const modal = document.getElementById("modal");
const pasteArea = document.getElementById("pasteArea");

/* =========================
   LOAD
========================= */

async function load(){

  try{

    const res = await fetch(API,{
      method:"GET",
      mode:"cors"
    });

    if(!res.ok){

      throw new Error(
        "HTTP " + res.status
      );
    }

    data = await res.json();

    render();

    dropdown();

  }catch(err){

    console.error(err);

    toast("Gagal load data");
  }
}

/* =========================
   DROPDOWN
========================= */

function dropdown(){

  const situs = [
    ...new Set(data.map(d=>d.Situs))
  ];

  siteFilter.innerHTML =
    `<option value="all">Semua</option>` +
    situs.map(v=>
      `<option value="${v}">
        ${v}
      </option>`
    ).join("");
}

/* =========================
   RENDER
========================= */

function render(){

  const filter =
    siteFilter.value || "all";

  let html = "";

  [...data]
  .reverse()
  .forEach(d=>{

    if(
      filter !== "all" &&
      d.Situs !== filter
    ) return;

    html += `
      <tr>

        <td>${d.Situs}</td>

        <td>
          ${new Date(d["Jam WD"])
            .toLocaleString("id-ID")}
        </td>

        <td>

          <img
            src="${d.Gambar}"
            onclick="viewImage('${d.Gambar}')"
          >

        </td>

        <td>

          <button
            class="action-btn edit"
            onclick="edit('${d.id}')"
          >
            Edit
          </button>

          <button
            class="action-btn del"
            onclick="removeData('${d.id}')"
          >
            Hapus
          </button>

        </td>

      </tr>
    `;
  });

  table.innerHTML = html;
}

siteFilter.addEventListener(
  "change",
  render
);

/* =========================
   OPEN FORM
========================= */

function openForm(){

  editId = null;

  modal.style.display = "flex";

  jam.value = "";

  gambar.value = "";

  previewImage.style.display = "none";
}

/* =========================
   CLOSE MODAL
========================= */

function closeModal(e){

  if(e.target.id === "modal"){

    modal.style.display = "none";
  }
}

/* =========================
   PREVIEW
========================= */

function updatePreview(){

  if(!gambar.value){

    previewImage.style.display =
      "none";

    return;
  }

  previewImage.src = gambar.value;

  previewImage.style.display =
    "block";
}

/* =========================
   SAVE
========================= */

async function save(){

  if(
    !jam.value ||
    !gambar.value
  ){

    toast("Lengkapi data");

    return;
  }

  try{

    const payload = {

      action :
        editId ? "edit" : "add",

      id :
        editId || "",

      situs :
        site.value,

      jam :
        jam.value,

      gambar :
        gambar.value
    };

    const res = await fetch(API,{

      method:"POST",

      body:JSON.stringify(payload)
    });

    const json = await res.json();

    if(!json.success){

      throw new Error(
        json.message
      );
    }

    toast("Berhasil disimpan");

    modal.style.display = "none";

    load();

  }catch(err){

    console.error(err);

    toast("Gagal simpan");
  }
}

/* =========================
   EDIT
========================= */

function edit(id){

  const d =
    data.find(x=>x.id == id);

  if(!d) return;

  editId = id;

  modal.style.display = "flex";

  site.value = d.Situs;

  jam.value =
    formatDate(d["Jam WD"]);

  gambar.value = d.Gambar;

  updatePreview();
}

/* =========================
   DELETE
========================= */

async function removeData(id){

  if(
    !confirm("Hapus data?")
  ) return;

  try{

    const res = await fetch(API,{

      method:"POST",

      body:JSON.stringify({

        action:"delete",

        id
      })
    });

    const json = await res.json();

    if(!json.success){

      throw new Error(
        json.message
      );
    }

    toast("Data dihapus");

    load();

  }catch(err){

    console.error(err);

    toast("Gagal hapus");
  }
}

/* =========================
   FORMAT DATE
========================= */

function formatDate(dateString){

  const d = new Date(dateString);

  const pad = n =>
    n.toString()
    .padStart(2,"0");

  return `${d.getFullYear()}-${
    pad(d.getMonth()+1)
  }-${
    pad(d.getDate())
  }T${
    pad(d.getHours())
  }:${
    pad(d.getMinutes())
  }`;
}

/* =========================
   IMAGE VIEWER
========================= */

function viewImage(src){

  const modal =
    document.getElementById(
      "imageModal"
    );

  const img =
    document.getElementById(
      "modalImage"
    );

  img.src = src;

  modal.style.display = "flex";
}

document
.getElementById("imageModal")
.addEventListener("click",()=>{

  document.getElementById(
    "imageModal"
  ).style.display = "none";
});

/* =========================
   TOAST
========================= */

function toast(msg){

  const t =
    document.getElementById(
      "toast"
    );

  t.innerText = msg;

  t.classList.add("show");

  setTimeout(()=>{

    t.classList.remove("show");

  },2000);
}

/* =========================
   HANDLE IMAGE
========================= */

function handleImage(file){

  if(!file) return;

  if(
    file.size >
    2 * 1024 * 1024
  ){

    toast("Maksimal 2MB");

    return;
  }

  const reader =
    new FileReader();

  reader.onload = ()=>{

    gambar.value =
      reader.result;

    updatePreview();
  };

  reader.readAsDataURL(file);
}

/* =========================
   PASTE
========================= */

pasteArea.addEventListener(
  "paste",
  e=>{

    const item =
      [...e.clipboardData.items]
      .find(i=>
        i.type.startsWith("image")
      );

    if(!item) return;

    handleImage(
      item.getAsFile()
    );
});

/* =========================
   DRAG DROP
========================= */

pasteArea.addEventListener(
  "dragover",
  e=>{

    e.preventDefault();
});

pasteArea.addEventListener(
  "drop",
  e=>{

    e.preventDefault();

    handleImage(
      e.dataTransfer.files[0]
    );
});

/* =========================
   START
========================= */

load();

</script>

</body>
</html>
